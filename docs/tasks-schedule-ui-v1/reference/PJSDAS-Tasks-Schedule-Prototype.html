 if(a==='job'){if(dialog.open)closeDialog();openJob(id)}

 if(a==='mark-apply')queueChange({kind:'apply',jobId:id,taskId:tasks().find(t=>t.jobId===id&&t.kind==='apply')?.id});
 if(a==='complete-task')queueChange({kind:'task',taskId:id,jobId:getTask(id)?.jobId});
 if(a==='complete-event')queueChange({kind:'event',eventId:id,jobId:getEvent(id)?.jobId});
 if(a==='preview-capture')previewCapture();
 if(a==='edit-capture'){preview=null;$('#preview-result').innerHTML='';$('.dialog-foot').innerHTML='<button class="btn primary" data-action="preview-capture">继续</button>';$('#capture-input')?.focus()}
 if(a==='save-capture'&&preview&&!['unsupported','decision'].includes(preview.kind))queueChange(preview);
 if(a==='recover')showRecovery();
 if(a==='release-save'||a==='check-save')commitPending();
 if(a==='accept-change'){pending.status='saving';pending.kind='reschedule';pending.time='14:00';pending.date='2026-09-28';undoSnapshot=clone(data);commitPending()}
 if(a==='keep-current'){pending=null;closeDialog();render(true);showToast('已保留当前时间')}
 if(a==='resolve-decision'){const choice=$('input[name="job-choice"]:checked');if(!choice){announce('请先选择一个岗位');return}let ev=data.events.find(e=>e.jobId===choice.value&&e.kind==='面试'&&e.status==='planned');if(!ev)return;queueChange({kind:'reschedule',eventId:ev.id,jobId:choice.value,date:'2026-09-28',time:'14:00',resolveDecision:true})}
 if(a==='undo'&&undoSnapshot){data=clone(undoSnapshot);undoSnapshot=null;$('#toast').hidden=true;render(true);announce('演示变化已撤销')}
 if(a==='dismiss-toast')$('#toast').hidden=true;
 if(a==='retry'){if(['error','loading'].includes(scenario))data=clone(SEED);scenario='normal';render(true);showToast('已刷新（演示）')}
 if(a==='large'){document.documentElement.classList.toggle('large');render(true)}
 if(a==='reset')applyScenario('normal');
 if(a==='connection')openDialog('输入来源','<p>此原型不连接 Gmail、ChatGPT 或其他真实来源。</p><p>正式设置应展示当前授权、最近成功更新和必要的恢复动作，不新增授权范围。</p>','<button class="btn secondary" data-action="close">知道了</button>');
 if(a==='privacy')openDialog('数据与隐私','<p>本设计预览不发送输入，不使用真实账户，也不持久保存演示内容。刷新页面即可重置。</p>','<button class="btn secondary" data-action="close">关闭</button>');
});
document.addEventListener('input',e=>{if(e.target.id==='job-search'){libraryQuery=e.target.value;$('.library-list').innerHTML=libraryRows();$('.library-count').textContent=librarySource().length+' 个岗位'}if(e.target.id==='capture-input'){draft=e.target.value;if(preview){preview=null;$('#preview-result').innerHTML='';$('.dialog-foot').innerHTML='<button class="btn primary" data-action="preview-capture">继续</button>'}}});
document.addEventListener('change',e=>{if(e.target.id==='scenario')applyScenario(e.target.value);if(e.target.id==='schedule-month'){const month=e.target.value;const days=[...document.querySelectorAll('.schedule-day')];const match=days.find(el=>el.id.slice(4,11)===month);if(match)scrollScheduleTo(match.id.slice(4));else showToast('这个月没有已记录的日程')}});
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#/"]');if(!a)return;e.preventDefault();if(dialog.open)closeDialog();navigate(a.hash.slice(2))});
window.addEventListener('popstate',()=>{route=location.hash.slice(2)||'today';render(true)});
$('#skip').addEventListener('click',e=>{e.preventDefault();$('main').focus()});
dialog.addEventListener('cancel',e=>{e.preventDefault();closeDialog()});
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()}});
document.addEventListener('keydown',e=>{if(dialog.open&&e.key==='Tab'){const all=[...dialog.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),textarea:not([disabled]),select:not([disabled]),[tabindex="0"]')].filter(n=>n.getClientRects().length);const first=all[0],last=all.at(-1);if(!first)return;if(e.shiftKey&&(document.activeElement===first||!all.includes(document.activeElement))){e.preventDefault();last.focus()}else if(!e.shiftKey&&(document.activeElement===last||!all.includes(document.activeElement))){e.preventDefault();first.focus()}}
 const tab=e.target.closest('[role="tab"]');if(tab&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=[...document.querySelectorAll('.mobile-panels [role="tab"]')];const i=e.key==='Home'?0:e.key==='End'?tabs.length-1:(tabs.indexOf(tab)+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs[i].click();tabs[i].focus()}
});
