name: Patch Today opportunity reconciliation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-today-opportunity-reconcile.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patch
        run: echo '' | base64 -d | python3
      - name: Verify
        run: |
          npm ci
          npm test
          npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppV5.tsx src/processEvents.ts src/db.ts
          git commit -m "Prioritize upcoming nodes and reconcile process events"
          git push
