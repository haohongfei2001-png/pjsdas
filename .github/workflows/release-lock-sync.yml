name: One-shot release lockfile sync

on:
  push:
    branches: [release-v1.0.1-closure]

permissions:
  contents: write

jobs:
  sync-lock-version:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release-v1.0.1-closure
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Synchronize root package-lock version
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          lock.version = pkg.version
          lock.packages[''].version = pkg.version
          fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`)
          NODE
      - name: Commit lockfile metadata if needed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "release: sync package-lock version for v1.0.1"
          git push origin HEAD:release-v1.0.1-closure
