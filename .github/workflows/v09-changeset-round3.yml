name: V09 ChangeSet Round 3

on:
  push:
    branches: [main]
    paths:
      - 'scripts/v09-changeset-round3.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply ChangeSet patch
        run: python3 scripts/v09-changeset-round3.py
      - name: Release version
        run: npm version 0.9.0 --no-git-tag-version --allow-same-version
      - name: Verify
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          npm run build
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests README.md package.json package-lock.json
          git commit -m "Add unified ChangeSet mutation protocol"
          git push
