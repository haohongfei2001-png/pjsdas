name: Deploy PJSDAS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  standby:
    runs-on: ubuntu-latest
    outputs:
      origin: ${{ steps.standby-origin.outputs.origin }}
      configured: ${{ steps.standby-config.outputs.configured }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PJSDAS_TOKEN_ENCRYPTION_KEY: ${{ secrets.PJSDAS_TOKEN_ENCRYPTION_KEY }}
      PJSDAS_GOOGLE_CLIENT_SECRET: ${{ secrets.PJSDAS_GOOGLE_CLIENT_SECRET }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      PJSDAS_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      PJSDAS_CONNECTED_AUTHORITY: ${{ vars.PJSDAS_CONNECTED_AUTHORITY || 'google-drive' }}
      PJSDAS_AUDIENCE_MODE: ${{ vars.PJSDAS_AUDIENCE_MODE || 'legacy' }}
      PJSDAS_CANONICAL_WEB_ORIGIN: ${{ vars.PJSDAS_CANONICAL_WEB_ORIGIN }}
      PJSDAS_CANONICAL_API_ORIGIN: ${{ vars.PJSDAS_CANONICAL_API_ORIGIN }}
      PJSDAS_LEGACY_WEB_ORIGINS: ${{ vars.PJSDAS_LEGACY_WEB_ORIGINS || 'https://haohongfei2001-png.github.io' }}
      PJSDAS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PJSDAS_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Detect configured Cloudflare standby
        id: standby-config
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            PJSDAS_TOKEN_ENCRYPTION_KEY \
            PJSDAS_GOOGLE_CLIENT_SECRET \
            AI_GATEWAY_API_KEY \
            PJSDAS_GOOGLE_CLIENT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Cloudflare standby dependency ${name} is not configured."
              missing=1
            fi
          done
          if { [ "${PJSDAS_CONNECTED_AUTHORITY:-google-drive}" = "transactional" ] || [ "${PJSDAS_AUDIENCE_MODE:-legacy}" = "allowlist" ]; } && [ -z "${PJSDAS_SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "Cloudflare standby transactional authority / allowlist mode requires PJSDAS_SUPABASE_SERVICE_ROLE_KEY."
            missing=1
          fi
          if [ "$missing" -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare standby is dormant; continuing with configured production backends only."
          fi

      - uses: actions/checkout@v7
        if: steps.standby-config.outputs.configured == 'true'

      - uses: actions/setup-node@v7
        if: steps.standby-config.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install standby dependencies
        if: steps.standby-config.outputs.configured == 'true'
        run: npm ci

      - name: Prepare Cloudflare secret bundle
        if: steps.standby-config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs')
          const required = [
            'PJSDAS_TOKEN_ENCRYPTION_KEY',
            'PJSDAS_GOOGLE_CLIENT_SECRET',
            'AI_GATEWAY_API_KEY',
          ]
          if (process.env.PJSDAS_CONNECTED_AUTHORITY === 'transactional' || process.env.PJSDAS_AUDIENCE_MODE === 'allowlist') required.push('PJSDAS_SUPABASE_SERVICE_ROLE_KEY')
          const payload = Object.fromEntries(required.map(name => [name, process.env[name]]))
          fs.writeFileSync('.cloudflare-secrets.json', JSON.stringify(payload), { mode: 0o600 })
          NODE

      - name: Bind standby release candidate identity
        if: steps.standby-config.outputs.configured == 'true'
        run: WORKERS_CI_COMMIT_SHA="$GITHUB_SHA" node scripts/write-release-identity.mjs

      - name: Deploy exact-SHA Cloudflare standby
        if: steps.standby-config.outputs.configured == 'true'
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy \
            --secrets-file .cloudflare-secrets.json \
            --var "WORKERS_CI_COMMIT_SHA:${GITHUB_SHA}" \
            --var "PJSDAS_GOOGLE_CLIENT_ID:${PJSDAS_GOOGLE_CLIENT_ID}" \
            --var "PJSDAS_CONNECTED_AUTHORITY:${PJSDAS_CONNECTED_AUTHORITY}" \
            --var "PJSDAS_AUDIENCE_MODE:${PJSDAS_AUDIENCE_MODE}" \
            --var "PJSDAS_CANONICAL_WEB_ORIGIN:${PJSDAS_CANONICAL_WEB_ORIGIN}" \
            --var "PJSDAS_CANONICAL_API_ORIGIN:${PJSDAS_CANONICAL_API_ORIGIN}" \
            --var "PJSDAS_LEGACY_WEB_ORIGINS:${PJSDAS_LEGACY_WEB_ORIGINS}"

      - name: Resolve and verify Cloudflare standby origin
        id: standby-origin
        if: steps.standby-config.outputs.configured == 'true'
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        shell: bash
        run: |
          set -euo pipefail
          origin="$(node - <<'NODE'
          const fs = require('node:fs')
          const path = process.env.WRANGLER_OUTPUT_FILE_PATH
          const lines = fs.readFileSync(path, 'utf8').split(/\r?\n/).filter(Boolean)
          const urls = []
          function visit(value) {
            if (typeof value === 'string' && /^https:\/\/[^\s]+\.workers\.dev\/?$/i.test(value)) urls.push(value.replace(/\/$/, ''))
            else if (Array.isArray(value)) value.forEach(visit)
            else if (value && typeof value === 'object') Object.values(value).forEach(visit)
          }
          for (const line of lines) {
            try { visit(JSON.parse(line)) } catch {}
          }
          const origin = urls.at(-1)
          if (!origin) process.exit(1)
          process.stdout.write(origin)
          NODE
          )"
          echo "Cloudflare standby origin: ${origin}"
          body="$(curl -fsS --max-time 15 "${origin}/api/health")"
          printf '%s' "$body" | node -e '
            let raw = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const health = JSON.parse(raw);
              const ready =
                health.status === "ok" &&
                health.release?.commitSha === process.env.GITHUB_SHA &&
                health.capabilities?.deploymentPortability === true &&
                health.capabilities?.backgroundDiscoveryAutomation === "v1" &&
                health.capabilities?.backgroundGmailAutomation === "v1";
              process.exit(ready ? 0 : 1);
            });
          '
          echo "origin=${origin}" >> "$GITHUB_OUTPUT"

      - name: Remove temporary Cloudflare secret bundle
        if: always() && steps.standby-config.outputs.configured == 'true'
        run: rm -f .cloudflare-secrets.json

  pages-build:
    runs-on: ubuntu-latest
    needs: standby
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      PJSDAS_EXPECTED_WORKSPACE_AUTHORITY: ${{ vars.PJSDAS_CONNECTED_AUTHORITY || 'google-drive' }}
      PJSDAS_EXPECTED_AUDIENCE_MODE: ${{ vars.PJSDAS_AUDIENCE_MODE || 'legacy' }}
      PJSDAS_EXPECTED_CANONICAL_WEB_ORIGIN: ${{ vars.PJSDAS_CANONICAL_WEB_ORIGIN }}
      PJSDAS_EXPECTED_CANONICAL_API_ORIGIN: ${{ vars.PJSDAS_CANONICAL_API_ORIGIN }}
      VITE_PJSDAS_CONNECTED_AUTHORITY: ${{ vars.PJSDAS_CONNECTED_AUTHORITY || 'google-drive' }}
      VITE_PJSDAS_CANONICAL_WEB_ORIGIN: ${{ vars.PJSDAS_CANONICAL_WEB_ORIGIN }}
      VITE_PJSDAS_CANONICAL_API_ORIGIN: ${{ vars.PJSDAS_CANONICAL_API_ORIGIN }}
      VITE_PJSDAS_LEGACY_WEB_ORIGINS: ${{ vars.PJSDAS_LEGACY_WEB_ORIGINS || 'https://haohongfei2001-png.github.io' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Resolve release candidate contract
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_ENV"
          import { resolveReleaseMetadata } from './scripts/release-metadata.mjs'
          const metadata = resolveReleaseMetadata()
          console.log(`PJSDAS_EXPECTED_PRODUCT_VERSION=${metadata.productVersion}`)
          console.log(`PJSDAS_EXPECTED_RELEASE_CHANNEL=${metadata.releaseChannel}`)
          console.log(`PJSDAS_EXPECTED_MCP_CONTRACT_HASH=${metadata.mcpContractHash}`)
          console.log(`PJSDAS_EXPECTED_MIGRATION_SET_HASH=${metadata.migrationSetHash}`)
          console.log(`PJSDAS_EXPECTED_SNAPSHOT_SCHEMA=${metadata.snapshotSchema}`)
          console.log(`PJSDAS_EXPECTED_SNAPSHOT_VERSION=${metadata.snapshotVersion}`)
          NODE

      - name: Resolve ordered production backend origins
        shell: bash
        env:
          CONFIGURED_BACKENDS: ${{ vars.PJSDAS_BACKEND_ORIGINS || 'https://pjsdas-remote-alpha.vercel.app' }}
          CANONICAL_API_ORIGIN: ${{ vars.PJSDAS_CANONICAL_API_ORIGIN }}
          CLOUDFLARE_STANDBY_ORIGIN: ${{ needs.standby.outputs.origin }}
        run: |
          set -euo pipefail
          origins="$CONFIGURED_BACKENDS"
          canonical="${CANONICAL_API_ORIGIN%/}"
          if [ -n "$canonical" ] && ! printf ',%s,' ",${origins}," | grep -Fq ",${canonical},"; then
            origins="${canonical},${origins}"
          fi
          standby="${CLOUDFLARE_STANDBY_ORIGIN%/}"
          if [ -n "$standby" ] && ! printf ',%s,' ",${origins}," | grep -Fq ",${standby},"; then
            origins="${origins},${standby}"
          fi
          echo "PJSDAS_BACKEND_ORIGINS=${origins}" >> "$GITHUB_ENV"
          echo "VITE_PJSDAS_BACKEND_ORIGINS=${origins}" >> "$GITHUB_ENV"
          echo "Release backend candidates: ${origins}"

      - name: Wait for exact matching production backend
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra configured_origins <<< "$PJSDAS_BACKEND_ORIGINS"
          for attempt in $(seq 1 40); do
            echo "Backend release gate attempt ${attempt}/40 for commit ${GITHUB_SHA}"
            for raw_origin in "${configured_origins[@]}"; do
              origin="$(printf '%s' "$raw_origin" | xargs)"
              [ -n "$origin" ] || continue
              origin="${origin%/}"
              echo "Checking ${origin}"
              body="$(curl -fsS --max-time 10 "${origin}/api/health" 2>/dev/null || true)"
              if [ -n "$body" ] && printf '%s' "$body" | node -e '
                let raw = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", chunk => raw += chunk);
                process.stdin.on("end", () => {
                  try {
                    const health = JSON.parse(raw);
                    const capabilities = health.capabilities ?? {};
                    const authenticatedMcp = health.authenticatedMcp ?? {};
                    const requiredTools = Array.isArray(authenticatedMcp.releaseRequiredTools)
                      ? authenticatedMcp.releaseRequiredTools
                      : [];
                    const expectedAuthority = process.env.PJSDAS_EXPECTED_WORKSPACE_AUTHORITY === "transactional" ? "transactional" : "google-drive";
                    const expectedAudience = process.env.PJSDAS_EXPECTED_AUDIENCE_MODE === "allowlist" ? "allowlist" : "legacy";
                    const topology = health.topology ?? {};
                    const expectedWeb = (process.env.PJSDAS_EXPECTED_CANONICAL_WEB_ORIGIN || "").replace(/\/$/, "");
                    const expectedApi = (process.env.PJSDAS_EXPECTED_CANONICAL_API_ORIGIN || "").replace(/\/$/, "");
                    const topologyReady =
                      topology.audienceMode === expectedAudience &&
                      (!expectedWeb || topology.canonicalWebOrigin === expectedWeb) &&
                      (!expectedApi || topology.canonicalApiOrigin === expectedApi);
                    const expectedTools = [
                      "get_coverage_status",
                      "get_workspace_integrity",
                      "add_opportunities",
                      ...(expectedAuthority === "transactional" ? [
                        "apply_user_command",
                        "semantic_intake",
                        "resolve_semantic_decision",
                        "undo_semantic_command",
                      ] : []),
                      "ingest_discovery_run",
                      "ingest_gmail_run",
                    ];
                    const releaseToolsReady = expectedTools.every(tool => requiredTools.includes(tool));
                    const expectedMode = expectedAuthority === "transactional" ? "transactional-connected" : "google-drive-trusted-ingestion";
                    const ready =
                      health.status === "ok" &&
                      health.version === "1.9.0-alpha.1" &&
                      health.mode === expectedMode &&
                      health.workspaceAuthority === expectedAuthority &&
                      health.release?.commitSha === process.env.GITHUB_SHA &&
                      health.release?.productVersion === process.env.PJSDAS_EXPECTED_PRODUCT_VERSION &&
                      health.release?.releaseChannel === process.env.PJSDAS_EXPECTED_RELEASE_CHANNEL &&
                      health.release?.mcpContractHash === process.env.PJSDAS_EXPECTED_MCP_CONTRACT_HASH &&
                      health.release?.migrationSetHash === process.env.PJSDAS_EXPECTED_MIGRATION_SET_HASH &&
                      health.release?.schemaCompatibility?.snapshotSchema === process.env.PJSDAS_EXPECTED_SNAPSHOT_SCHEMA &&
                      String(health.release?.schemaCompatibility?.snapshotVersion) === process.env.PJSDAS_EXPECTED_SNAPSHOT_VERSION &&
                      capabilities.autonomousIngestion === "v1.9" &&
                      capabilities.ingestionReconciliationLedger === true &&
                      capabilities.coverageStatusRead === true &&
                      capabilities.trustedMonitorIngestion === true &&
                      capabilities.trustedGmailIngestion === true &&
                      capabilities.stableAccountSession === "v1.8.1" &&
                      capabilities.dynamicSourceRegistry === true &&
                      capabilities.coverageFreshnessSla === true &&
                      capabilities.workspaceIntegrityAudit === true &&
                      capabilities.ingestionDryRunReplay === true &&
                      capabilities.sourceHealthHistory === true &&
                      capabilities.productionSelfTest === true &&
                      capabilities.deploymentPortability === true &&
                      capabilities.releaseIdentityBinding === true &&
                      capabilities.authenticatedMcpToolSurface === true &&
                      capabilities.delegatedCredentialIsolation === true &&
                      capabilities.trustedIngestionGrantModel === "v1" &&
                      capabilities.transactionalWorkspaceFoundation === "v1" &&
                      capabilities.mutationCommandLedger === true &&
                      capabilities.explicitUserCommands === "v1" &&
                      capabilities.semanticIntakeContract === "v1" &&
                      capabilities.decisionRequests === "v1" &&
                      capabilities.semanticCompensatingUndo === "v1" &&
                      capabilities.semanticServerWritePolicy === "v1" &&
                      capabilities.opportunityParticipationState === "v1" &&
                      capabilities.gmailCompleteConsumption === "v1" &&
                      capabilities.discoverySourceVerification === "v1" &&
                      capabilities.discoveryFactAssessmentSeparation === true &&
                      capabilities.canonicalOriginPolicy === "v1" &&
                      capabilities.controlledAudience === "v1" &&
                      capabilities.connectedOriginMigration === "v1" &&
                      capabilities.releaseCandidateManifest === "v1" &&
                      topologyReady &&
                      authenticatedMcp.toolSurfaceVersion === "v5" &&
                      releaseToolsReady;
                    process.exit(ready ? 0 : 1);
                  } catch {
                    process.exit(1);
                  }
                });
              '; then
                echo "PJSDAS backend at ${origin} matches commit ${GITHUB_SHA} and advertises the required authenticated MCP tool surface."
                echo "PJSDAS_ACTIVE_BACKEND_ORIGIN=${origin}" >> "$GITHUB_ENV"
                exit 0
              fi
            done
            sleep 15
          done

          echo "No configured PJSDAS backend matched commit ${GITHUB_SHA} with the required MCP release surface; refusing to publish." >&2
          exit 1

      - run: npm ci

      - name: Verify production contract before Pages publication
        shell: bash
        run: |
          PJSDAS_PRODUCTION_BASE_URLS="$PJSDAS_BACKEND_ORIGINS" \
          PJSDAS_EXPECTED_COMMIT_SHA="$GITHUB_SHA" \
          PJSDAS_EXPECTED_WORKSPACE_AUTHORITY="$PJSDAS_EXPECTED_WORKSPACE_AUTHORITY" \
          npm run self-test:production

      - run: npm run build

      - name: Verify frontend release manifest before upload
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const manifest = JSON.parse(fs.readFileSync('dist/release-manifest.json', 'utf8'))
          const expected = {
            commitSha: process.env.GITHUB_SHA,
            productVersion: process.env.PJSDAS_EXPECTED_PRODUCT_VERSION,
            releaseChannel: process.env.PJSDAS_EXPECTED_RELEASE_CHANNEL,
            mcpContractHash: process.env.PJSDAS_EXPECTED_MCP_CONTRACT_HASH,
            migrationSetHash: process.env.PJSDAS_EXPECTED_MIGRATION_SET_HASH,
          }
          for (const [key, value] of Object.entries(expected)) {
            if (manifest[key] !== value) throw new Error(`frontend release manifest ${key}=${manifest[key]} expected=${value}`)
          }
          if (!/^sha256:[0-9a-f]{64}$/i.test(manifest.frontendArtifactDigest ?? '')) {
            throw new Error('frontend artifact digest is missing or invalid')
          }
          NODE

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: pages-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
