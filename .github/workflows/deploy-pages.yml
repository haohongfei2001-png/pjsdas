name: Deploy PJSDAS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      PJSDAS_BACKEND_ORIGINS: ${{ vars.PJSDAS_BACKEND_ORIGINS || 'https://pjsdas-remote-alpha.vercel.app' }}
      VITE_PJSDAS_BACKEND_ORIGINS: ${{ vars.PJSDAS_BACKEND_ORIGINS || 'https://pjsdas-remote-alpha.vercel.app' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Wait for exact matching hardened v1.9 production backend
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra configured_origins <<< "$PJSDAS_BACKEND_ORIGINS"
          for attempt in $(seq 1 40); do
            echo "Backend release gate attempt ${attempt}/40 for commit ${GITHUB_SHA}"
            for raw_origin in "${configured_origins[@]}"; do
              origin="$(printf '%s' "$raw_origin" | xargs)"
              [ -n "$origin" ] || continue
              origin="${origin%/}"
              echo "Checking ${origin}"
              body="$(curl -fsS --max-time 10 "${origin}/api/health" 2>/dev/null || true)"
              if [ -n "$body" ] && printf '%s' "$body" | node -e '
                let raw = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", chunk => raw += chunk);
                process.stdin.on("end", () => {
                  try {
                    const health = JSON.parse(raw);
                    const capabilities = health.capabilities ?? {};
                    const ready =
                      health.status === "ok" &&
                      health.version === "1.9.0-alpha.1" &&
                      health.mode === "google-drive-trusted-ingestion" &&
                      health.release?.commitSha === process.env.GITHUB_SHA &&
                      capabilities.autonomousIngestion === "v1.9" &&
                      capabilities.ingestionReconciliationLedger === true &&
                      capabilities.coverageStatusRead === true &&
                      capabilities.trustedMonitorIngestion === true &&
                      capabilities.trustedGmailIngestion === true &&
                      capabilities.stableAccountSession === "v1.8.1" &&
                      capabilities.dynamicSourceRegistry === true &&
                      capabilities.coverageFreshnessSla === true &&
                      capabilities.workspaceIntegrityAudit === true &&
                      capabilities.ingestionDryRunReplay === true &&
                      capabilities.sourceHealthHistory === true &&
                      capabilities.productionSelfTest === true &&
                      capabilities.deploymentPortability === true &&
                      capabilities.releaseIdentityBinding === true;
                    process.exit(ready ? 0 : 1);
                  } catch {
                    process.exit(1);
                  }
                });
              '; then
                echo "PJSDAS backend at ${origin} matches commit ${GITHUB_SHA}."
                echo "PJSDAS_ACTIVE_BACKEND_ORIGIN=${origin}" >> "$GITHUB_ENV"
                exit 0
              fi
            done
            sleep 15
          done

          echo "No configured PJSDAS backend matched commit ${GITHUB_SHA}; refusing to publish a frontend against a different backend build." >&2
          exit 1

      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
