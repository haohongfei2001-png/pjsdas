name: Patch progress duration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-progress-duration.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve parsed process-event duration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/progressUpdateV2.ts')
          s = p.read_text()
          old = "            estimatedMinutes: defaultMinutesForProcessEvent(detected.type!),\n"
          new = "            estimatedMinutes: parsed.estimatedMinutes ?? defaultMinutesForProcessEvent(detected.type!),\n"
          if old not in s:
              raise SystemExit('duration anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/progressUpdateV2.ts
          git commit -m "Preserve stated process-event duration"
          git push
