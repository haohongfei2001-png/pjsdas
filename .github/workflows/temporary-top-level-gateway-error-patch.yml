name: Temporary Gateway top-level error patch

on:
  push:
    branches: [fix/discovery-gateway-top-level-errors]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/discovery-gateway-top-level-errors
      - name: Apply exact diagnostic patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          worker = Path('gateway/discoveryAutomationWorker.ts')
          text = worker.read_text()
          old = """  const root = payload as Record<string, unknown>\n  const nested = root.error && typeof root.error === 'object' ? root.error as Record<string, unknown> : root\n  return {\n    type: typeof nested.type === 'string' ? nested.type : undefined,\n    message: typeof nested.message === 'string' ? nested.message : undefined,\n  }\n"""
          new = """  const root = payload as Record<string, unknown>\n  const nested = root.error && typeof root.error === 'object' ? root.error as Record<string, unknown> : root\n  return {\n    type: typeof nested.type === 'string' ? nested.type : undefined,\n    message: typeof nested.message === 'string'\n      ? nested.message\n      : typeof root.error === 'string'\n        ? root.error\n        : undefined,\n  }\n"""
          if old not in text:
              raise SystemExit('gatewayErrorDetails target not found')
          text = text.replace(old, new, 1)
          old2 = """    if (message.includes('allowlist') || message.includes('not allowed') || message.includes('restriction')) {\n      throw new WorkspaceSourceError('DISCOVERY_MODEL_RESTRICTED', 'Vercel AI Gateway team restrictions block the selected discovery model or provider.', false)\n    }\n"""
          new2 = """    if (details.type === 'no_providers_available' || message.includes('allowlist') || message.includes('not allowed') || message.includes('restriction') || message.includes('restricted access')) {\n      throw new WorkspaceSourceError('DISCOVERY_MODEL_RESTRICTED', 'Vercel AI Gateway team restrictions block the selected discovery model or provider.', false)\n    }\n"""
          if old2 not in text:
              raise SystemExit('restriction target not found')
          worker.write_text(text.replace(old2, new2, 1))

          tests = Path('tests/discoveryAutomationWorker.test.ts')
          test_text = tests.read_text()
          marker = """  it('distinguishes a free-tier model restriction from project authentication failure', async () => {\n"""
          addition = """  it('classifies the official top-level no_providers_available Gateway shape as a team restriction', async () => {\n    const snapshot = await demoSnapshot()\n    await expect(discoverSourceRun(snapshot, sourceRun(), {\n      executionRules: [],\n      now: new Date('2026-09-15T01:00:00.000Z'),\n      ai: {\n        generateTextImpl: async () => {\n          throw {\n            statusCode: 403,\n            responseBody: JSON.stringify({\n              error: 'Your team has restricted access to this model. Contact the owner of the account for more details.',\n              type: 'no_providers_available',\n              statusCode: 403,\n            }),\n          }\n        },\n      },\n    })).rejects.toMatchObject({\n      code: 'DISCOVERY_MODEL_RESTRICTED',\n      retryable: false,\n    })\n  })\n\n"""
          if marker not in test_text:
              raise SystemExit('test insertion marker not found')
          tests.write_text(test_text.replace(marker, addition + marker, 1))
          PY
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gateway/discoveryAutomationWorker.ts tests/discoveryAutomationWorker.test.ts
          git commit -m "fix: recognize official Gateway restriction errors"
          git push origin HEAD:fix/discovery-gateway-top-level-errors
