name: Patch v0.8 parser safety

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v08-parser.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch parser safety
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/progressUpdate.ts')
          text = path.read_text()

          old_infer = """  const explicit = text.split(/[｜|]/).map((item) => item.trim()).filter(Boolean)
  if (explicit.length >= 2) return { company: explicit[0], roleText: explicit.slice(1).join('｜') }

  const patterned = text.match(/^(.{2,18}?(?:公司|集团|银行|汽车|证券|保险|咨询|电子|科技|国际|机器人))(.+)$/)
  if (patterned?.[1] && patterned[2]) return { company: patterned[1].trim(), roleText: patterned[2].trim() }
  return undefined
"""
          new_infer = """  const explicit = text.split(/[｜|:：]/).map((item) => item.trim()).filter(Boolean)
  if (explicit.length >= 2) return { company: explicit[0], roleText: explicit.slice(1).join('｜') }

  const latinCompany = text.match(/^([A-Za-z][A-Za-z0-9& .'-]{1,30})([\\u4e00-\\u9fff].+)$/)
  if (latinCompany?.[1] && latinCompany[2]) {
    return { company: latinCompany[1].trim(), roleText: latinCompany[2].trim() }
  }

  const patterned = text.match(/^(.{2,18}?(?:公司|集团|银行|汽车|证券|保险|咨询|电子|科技|国际|机器人))(.+)$/)
  if (patterned?.[1] && patterned[2]) return { company: patterned[1].trim(), roleText: patterned[2].trim() }
  return undefined
"""
          if old_infer not in text:
              raise SystemExit('infer block not found')
          text = text.replace(old_infer, new_infer, 1)

          old_same = """  const same = opportunities.filter((item) => sameCompany(item.company, company))
  const recentId = recentByCompany.get(compact(company))
"""
          new_same = """  const same = opportunities.filter((item) => sameCompany(item.company, company))

  let roleContext = text
  for (const alias of companyAliases(company).sort((a, b) => b.length - a.length)) {
    roleContext = roleContext.replace(alias, '')
  }
  const roleHint = roleContext
    .split(/(?:流程|测评|笔试|面试|考试|收到|接到|通知|邀请|截止|开启|重启|开始|结束|终止|关闭)/)[0]
    .trim()
  if (compact(roleHint).length >= 2) {
    const roleMatches = same.filter((item) => {
      const candidate = compact(item.role)
      const hint = compact(roleHint)
      return candidate.includes(hint) || hint.includes(candidate)
    })
    if (roleMatches.length === 1) {
      return { opportunity: roleMatches[0], confidence: 'medium' as UpdateConfidence, candidates: direct.candidates }
    }
  }

  const recentId = recentByCompany.get(compact(company))
"""
          if old_same not in text:
              raise SystemExit('target block not found')
          text = text.replace(old_same, new_same, 1)

          old_start = """  for (const row of splitInput(rawText, now)) {
    const sourceText = row.text
    const occurredAt = occurredAtFor(sourceText, row.baseDate, now)
"""
          new_start = """  for (const row of splitInput(rawText, now)) {
    const sourceText = row.text
    const occurredAt = occurredAtFor(sourceText, row.baseDate, now)
    const operationCountBefore = operations.length
"""
          if old_start not in text:
              raise SystemExit('loop start not found')
          text = text.replace(old_start, new_start, 1)

          old_end = """    if (!renameMatch && !closeLike && !reopenLike && !application && !eventLike) {
      const plannedTask = sourceText.match(/^(?:准备|计划|需要|要做)\\s*(.+)/)
      if (plannedTask?.[1]) {
        operations.push({
          id: operationId('action', sourceText),
          kind: 'manual_action',
          sourceText,
          confidence: 'medium',
          occurredAt: occurredAt.toISOString(),
          title: plannedTask[1].trim(),
          dueAt: row.explicitDate
            ? new Date(row.baseDate.getFullYear(), row.baseDate.getMonth(), row.baseDate.getDate(), 23, 59, 59).toISOString()
            : undefined,
          estimatedMinutes: 30,
        })
      }
    }
  }
"""
          new_end = """    if (!renameMatch && !closeLike && !reopenLike && !application && !eventLike) {
      const plannedTask = sourceText.match(/^(?:准备|计划|需要|要做)\\s*(.+)/)
      if (plannedTask?.[1]) {
        operations.push({
          id: operationId('action', sourceText),
          kind: 'manual_action',
          sourceText,
          confidence: 'medium',
          occurredAt: occurredAt.toISOString(),
          title: plannedTask[1].trim(),
          dueAt: row.explicitDate
            ? new Date(row.baseDate.getFullYear(), row.baseDate.getMonth(), row.baseDate.getDate(), 23, 59, 59).toISOString()
            : undefined,
          estimatedMinutes: 30,
        })
      }
    }

    if (operations.length === operationCountBefore) {
      operations.push(unresolved(
        sourceText,
        occurredAt,
        '这条文字没有被可靠识别为岗位、流程事件或待办，因此没有自动修改数据。',
      ))
    }
  }
"""
          if old_end not in text:
              raise SystemExit('loop end not found')
          text = text.replace(old_end, new_end, 1)

          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/progressUpdate.ts
          git commit -m "Fail closed on unmatched progress text"
          git push
