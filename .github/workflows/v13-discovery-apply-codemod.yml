name: v1.3 discovered opportunity apply codemod

on:
  push:
    branches: [v1.3-discovery-alpha]
    paths:
      - '.github/workflows/v13-discovery-apply-codemod.yml'

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.3-discovery-alpha
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/v13-discovery-apply-codemod.mjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/db.ts
          git commit -m 'Apply discovered opportunities atomically from ChangeSets'
          git push origin HEAD:v1.3-discovery-alpha
