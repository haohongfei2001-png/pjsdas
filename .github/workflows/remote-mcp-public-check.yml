name: Remote MCP public check

on:
  push:
    paths:
      - '.github/workflows/remote-mcp-public-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check public MCP initialize and tools
        shell: bash
        run: |
          set -euo pipefail
          URL='https://pjsdas-remote-alpha-haohongfei2001-8529.vercel.app/api/mcp'
          INIT='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"github-public-check","version":"1.0.0"}}}'
          curl --fail-with-body -sS -o /tmp/init.txt -X POST "$URL" -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' --data "$INIT"
          grep -q 'protocolVersion' /tmp/init.txt
          LIST='{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          curl --fail-with-body -sS -o /tmp/list.txt -X POST "$URL" -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -H 'MCP-Protocol-Version: 2025-06-18' --data "$LIST"
          grep -q 'get_today_plan' /tmp/list.txt
          grep -q 'get_decision_rules' /tmp/list.txt
          echo 'PUBLIC_REMOTE_MCP_OK'
