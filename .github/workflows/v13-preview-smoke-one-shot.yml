name: v1.3 preview smoke one-shot

on:
  push:
    branches: [v1.3-discovery-alpha]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for Vercel preview and verify public contract
        env:
          PJSDAS_BASE_URL: https://pjsdas-remote-alpha-git-v13-discovery-alpha-haohongfei2001-8529.vercel.app
          PJSDAS_EXPECTED_VERSION: 1.3.0-alpha.1
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            echo "Preview smoke attempt ${attempt}/30"
            if node scripts/v13-production-smoke.mjs; then
              exit 0
            fi
            sleep 10
          done
          echo "Preview never satisfied the v1.3 public production contract." >&2
          exit 1
