name: Verify authenticated OAuth boundary

on:
  push:
    paths:
      - '.github/workflows/verify-oauth-boundary.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public OAuth boundary
        shell: bash
        run: |
          set -euo pipefail
          base='https://pjsdas-remote-alpha.vercel.app'
          auth='https://yyrzwpoxlxpafdlbkdtg.supabase.co'

          for i in {1..18}; do
            status=$(curl -sS -o /tmp/health.json -w '%{http_code}' "$base/api/health-auth" || true)
            if [ "$status" = '200' ] && jq -e '.ready == true' /tmp/health.json >/dev/null; then break; fi
            sleep 5
          done
          echo "health_status=$status"
          cat /tmp/health.json
          jq -e '.ready == true and .secretsConfigured.tokenEncryptionKey == true and .secretsConfigured.googleClientId == true and .secretsConfigured.googleClientSecret == true' /tmp/health.json >/dev/null

          curl -fsS "$base/.well-known/oauth-protected-resource" -o /tmp/resource.json
          echo 'protected_resource_metadata:'
          cat /tmp/resource.json
          jq -e '.resource == "https://pjsdas-remote-alpha.vercel.app/api/mcp-auth" and (.authorization_servers | index("https://yyrzwpoxlxpafdlbkdtg.supabase.co/auth/v1")) != null' /tmp/resource.json >/dev/null

          curl -fsS "$auth/.well-known/oauth-authorization-server/auth/v1" -o /tmp/oauth.json
          echo 'oauth_discovery_selected:'
          jq '{issuer,authorization_endpoint,token_endpoint,registration_endpoint,scopes_supported,code_challenge_methods_supported}' /tmp/oauth.json
          jq -e '.authorization_endpoint and .token_endpoint and .registration_endpoint' /tmp/oauth.json >/dev/null

          code=$(curl -sS -D /tmp/mcp.headers -o /tmp/mcp.body -w '%{http_code}' \
            -X POST "$base/api/mcp-auth" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"oauth-boundary-check","version":"1"}}}')
          echo "mcp_unauthenticated_status=$code"
          grep -i '^www-authenticate:' /tmp/mcp.headers || true
          cat /tmp/mcp.body
          test "$code" = '401'
          grep -qi 'www-authenticate:.*resource_metadata=' /tmp/mcp.headers
          jq -e '.code == "AUTH_REQUIRED"' /tmp/mcp.body >/dev/null

          echo 'OAuth protected-resource discovery, dynamic registration, and unauthenticated fail-closed behavior are healthy.'
