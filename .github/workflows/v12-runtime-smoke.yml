name: v1.2 runtime smoke

on:
  push:
    paths:
      - '.github/workflows/v12-runtime-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production proposal and OAuth boundaries
        shell: bash
        run: |
          set -euo pipefail
          base='https://pjsdas-remote-alpha.vercel.app'

          for i in {1..24}; do
            code=$(curl -sS -o /tmp/verify.json -w '%{http_code}' \
              -X POST "$base/api/proposal-verify" \
              -H 'Origin: https://haohongfei2001-png.github.io' \
              -H 'content-type: application/json' \
              --data '{"token":"invalid.token"}' || true)
            if [ "$code" != '404' ]; then break; fi
            sleep 5
          done
          echo "proposal_verify_invalid=$code"
          cat /tmp/verify.json
          echo
          test "$code" = '400'
          jq -e '.code == "PROPOSAL_INVALID"' /tmp/verify.json >/dev/null

          preflight=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X OPTIONS "$base/api/proposal-verify" \
            -H 'Origin: https://haohongfei2001-png.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type')
          test "$preflight" = '204'

          mcp=$(curl -sS -D /tmp/mcp.headers -o /tmp/mcp.json -w '%{http_code}' \
            -X POST "$base/api/mcp" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}')
          test "$mcp" = '401'
          grep -qi 'www-authenticate:.*resource_metadata=' /tmp/mcp.headers
          jq -e '.code == "AUTH_REQUIRED"' /tmp/mcp.json >/dev/null

          curl -fsS "$base/.well-known/oauth-protected-resource" -o /tmp/resource.json
          jq -e '.resource == "https://pjsdas-remote-alpha.vercel.app/api/mcp"' /tmp/resource.json >/dev/null

          echo 'V12_RUNTIME_SMOKE_OK'
