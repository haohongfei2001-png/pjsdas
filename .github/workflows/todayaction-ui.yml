name: TodayAction UI Review
on:
  pull_request:
    paths: ['src/**','e2e/todayactionUI.ui.ts','e2e/fixtures/todayWorkspace.ts','playwright.todayaction-ui.config.mts','.github/workflows/todayaction-ui.yml']
  workflow_dispatch:
env:
  VITE_PJSDAS_CLOUD_MODE: mock
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          node scripts/verify-installed-runtime-lock.mjs --capture
          npm install --no-save @playwright/test@1.63.0
          node scripts/verify-installed-runtime-lock.mjs
      - run: npx playwright install --with-deps chromium
      - name: Prove mock cloud isolation before application browser tests
        run: npx playwright test --config=playwright.cloud-guard.config.mts --project=chromium
      - name: Render exact TA-01 baseline with the same synthetic fixtures
        env:
          TA_BASELINE: 6f4fe9a6528adf40c506cea84695b44b679aa24e
        shell: bash
        run: |
          set -euo pipefail
          baseline_dir="$RUNNER_TEMP/ta02-baseline"
          git fetch --depth=1 origin "$TA_BASELINE"
          git worktree add --detach "$baseline_dir" "$TA_BASELINE"
          mkdir -p "$baseline_dir/e2e/fixtures" "$baseline_dir/e2e/support"
          cp e2e/todayactionUI.ui.ts "$baseline_dir/e2e/"
          cp e2e/fixtures/todayWorkspace.ts "$baseline_dir/e2e/fixtures/"
          cp e2e/support/mockCloudIsolation.mts e2e/support/mockCloudProxySetup.mjs e2e/support/mockCloudTargets.ts "$baseline_dir/e2e/support/"
          cp playwright.todayaction-ui.config.mts "$baseline_dir/"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline_dir/node_modules"
          cd "$baseline_dir"
          GITHUB_SHA="$TA_BASELINE" PJSDAS_VITE_BASE=/pjsdas/ VITE_PJSDAS_CONNECTED_AUTHORITY=transactional npm run build
          TA_UI_REVIEW=before npx playwright test --config=playwright.todayaction-ui.config.mts
          cp -R test-results/ta02-before "$GITHUB_WORKSPACE/ta02-before"
      - name: Render corrected candidate and enforce layout, contrast and truthfulness
        run: |
          PJSDAS_VITE_BASE=/pjsdas/ VITE_PJSDAS_CONNECTED_AUTHORITY=transactional npm run build
          TA_UI_REVIEW=after npx playwright test --config=playwright.todayaction-ui.config.mts
      - name: Retain before-after screenshots and measured differences
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: todayaction-ui-review
          path: |
            ta02-before/
            test-results/
            playwright-report/
          retention-days: 14
