name: Browser E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    # A draft opt-in must name this exact same-repository head.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, format('full:{0}', github.event.pull_request.head.sha))))
    runs-on: ubuntu-24.04
    # The complete 180-core + 67-dense suite passed before the old 15-minute
    # cap interrupted teardown (15m11s). Keep every assertion and allow a
    # bounded five-minute runner/setup margin.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright test runner
        run: |
          node scripts/verify-installed-runtime-lock.mjs --capture
          npm install --no-save @playwright/test@1.63.0
          node scripts/verify-installed-runtime-lock.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify deadline-only settings and capture actual layouts
        run: npx playwright test --config=playwright.deadline-only-ui.config.mts
      - name: Run critical browser journeys
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/core
        run: npx playwright test --config=playwright.config.mts --project=chromium --output=test-results/core
      - name: Run dense instant journeys with production React runtime
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/instant
        run: npx playwright test --config=playwright.instant.config.mts --project=chromium
      - name: Upload browser failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            artifacts/deadline-only-ui/
          if-no-files-found: ignore
          retention-days: 7
