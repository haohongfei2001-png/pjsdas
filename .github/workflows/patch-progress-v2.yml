name: Patch progress v2 compile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-progress-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch strict array access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/progressUpdateV2.ts')
          s = p.read_text()
          old = "  if (latinWords[0]?.length >= 2) aliases.add(latinWords[0])\n"
          new = "  const firstLatinWord = latinWords[0]\n  if (firstLatinWord && firstLatinWord.length >= 2) aliases.add(firstLatinWord)\n"
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/progressUpdateV2.ts
          git commit -m "Fix strict progress parser compile"
          git push

# trigger
