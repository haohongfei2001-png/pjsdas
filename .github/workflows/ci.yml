name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  ci-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Draft/inner-loop unit gate
        run: npm test
      - name: Draft/inner-loop type gate
        run: npx tsc -b --pretty false
      - name: Dependency security gate
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: npm audit --audit-level=high
      - name: Production build
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: npm run build
      - name: Cloudflare standby bundle gate
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        shell: bash
        run: |
          set -euo pipefail
          secrets_file="$RUNNER_TEMP/pjsdas-cloudflare-ci-secrets.json"
          printf '%s' '{"PJSDAS_TOKEN_ENCRYPTION_KEY":"ci-only-placeholder","PJSDAS_GOOGLE_CLIENT_SECRET":"ci-only-placeholder","AI_GATEWAY_API_KEY":"ci-only-placeholder"}' > "$secrets_file"
          npx --yes wrangler@4 deploy \
            --dry-run \
            --outdir "$RUNNER_TEMP/pjsdas-cloudflare-worker" \
            --secrets-file "$secrets_file" \
            --var "WORKERS_CI_COMMIT_SHA:${GITHUB_SHA}" \
            --var "PJSDAS_GOOGLE_CLIENT_ID:ci-only.apps.googleusercontent.com"
          rm -f "$secrets_file"
