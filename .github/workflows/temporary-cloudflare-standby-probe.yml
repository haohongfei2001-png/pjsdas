name: Temporary Cloudflare standby probe

on:
  push:
    branches:
      - infra/activate-cloudflare-standby

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN_VALUE: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID_VALUE: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PJSDAS_TOKEN_ENCRYPTION_KEY_VALUE: ${{ secrets.PJSDAS_TOKEN_ENCRYPTION_KEY }}
      PJSDAS_GOOGLE_CLIENT_ID_VALUE: ${{ secrets.PJSDAS_GOOGLE_CLIENT_ID }}
      PJSDAS_GOOGLE_CLIENT_SECRET_VALUE: ${{ secrets.PJSDAS_GOOGLE_CLIENT_SECRET }}
      AI_GATEWAY_API_KEY_VALUE: ${{ secrets.AI_GATEWAY_API_KEY }}
    steps:
      - name: Report secret presence only
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            PJSDAS_TOKEN_ENCRYPTION_KEY \
            PJSDAS_GOOGLE_CLIENT_ID \
            PJSDAS_GOOGLE_CLIENT_SECRET \
            AI_GATEWAY_API_KEY; do
            value_name="${name}_VALUE"
            if [ -n "${!value_name:-}" ]; then
              echo "${name}=present"
            else
              echo "${name}=missing"
            fi
          done
