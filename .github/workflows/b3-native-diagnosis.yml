name: B3 bounded native diagnosis
on:
  pull_request:
    paths:
      - 'e2e/nativePaintDiagnostic.ui.ts'
      - 'playwright.native-paint.config.mts'
      - '.github/workflows/b3-native-diagnosis.yml'
env:
  VITE_PJSDAS_CLOUD_MODE: mock
permissions:
  contents: read
jobs:
  native-paint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Fixed, already accepted pre-B1 runtime: deadline-only copy (#255) and
      # operation-history separation (#256). Never use the candidate or transform pixels.
      TA_SECONDARY_BASE: dbad72074299c8f585a9b13d5f4ae0b3a6b32116
      TA_SECONDARY_DIAG: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          node scripts/verify-installed-runtime-lock.mjs --capture
          npm install --no-save @playwright/test@1.63.0
          node scripts/verify-installed-runtime-lock.mjs
      - run: npx playwright install --with-deps chromium
      - name: Prove mock cloud isolation before application browser tests
        run: npx playwright test --config=playwright.cloud-guard.config.mts --project=chromium
      - name: Render the fixed approved pre-B1 reference
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$TA_SECONDARY_BASE"
          baseline_dir="$RUNNER_TEMP/secondary-ui-base"
          git worktree add --detach "$baseline_dir" "$TA_SECONDARY_BASE"
          copy_baseline_evidence() {
            if [ -d "$baseline_dir/secondary-ui-before" ]; then
              cp -R "$baseline_dir/secondary-ui-before" "$GITHUB_WORKSPACE/"
            fi
            for name in native-paint-report test-results; do
              if [ -d "$baseline_dir/$name" ]; then
                mkdir -p "$GITHUB_WORKSPACE/secondary-baseline-evidence"
                cp -R "$baseline_dir/$name" "$GITHUB_WORKSPACE/secondary-baseline-evidence/"
              fi
            done
          }
          trap copy_baseline_evidence EXIT
          cp e2e/nativePaintDiagnostic.ui.ts "$baseline_dir/e2e/"
          mkdir -p "$baseline_dir/e2e/support"
          cp e2e/support/mockCloudIsolation.mts e2e/support/mockCloudProxySetup.mjs e2e/support/mockCloudTargets.ts e2e/support/libraryLayoutContract.ts "$baseline_dir/e2e/support/"
          cp playwright.native-paint.config.mts "$baseline_dir/"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline_dir/node_modules"
          cd "$baseline_dir"
          GITHUB_SHA="$TA_SECONDARY_BASE" PJSDAS_VITE_BASE=/pjsdas/ VITE_PJSDAS_CONNECTED_AUTHORITY=transactional npm run build
          TA_SECONDARY_PHASE=before npx playwright test --config=playwright.native-paint.config.mts
      - name: Record candidate native layers without replacing original visual gates
        run: |
          PJSDAS_VITE_BASE=/pjsdas/ VITE_PJSDAS_CONNECTED_AUTHORITY=transactional npm run build
          TA_SECONDARY_PHASE=after npx playwright test --config=playwright.native-paint.config.mts
      - name: Keep both phases and their failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: native-paint-before-after
          path: |
            secondary-ui-before/
            secondary-baseline-evidence/
            secondary-ui-after/
            native-paint-report/
            test-results/native-paint-diagnostic/
          retention-days: 14
  compact-confirmation-profile:
    # One bounded profile was captured on opening this diagnostic PR.
    if: github.event.action == 'opened'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          node scripts/verify-installed-runtime-lock.mjs --capture
          npm install --no-save @playwright/test@1.63.0
          node scripts/verify-installed-runtime-lock.mjs
      - run: chown "$(id -u):$(id -g)" "$HOME"
      - name: Prove mock cloud isolation
        run: npx playwright test --config=playwright.cloud-guard.config.mts --project=chromium
      - name: Record one native compact-confirmation profile
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/compact-native-diagnostic
          INSTANT_CONFIRMATION_TRACE: 1
        run: >-
          npx playwright test --config=playwright.perf.config.mts --project=chromium
          e2e/instantInteraction.perf.ts
          --grep 'ordinary compact confirmation and Undo stay incremental'
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: compact-confirmation-native-diagnostic
          path: |
            playwright-report/
            test-results/
          retention-days: 7
