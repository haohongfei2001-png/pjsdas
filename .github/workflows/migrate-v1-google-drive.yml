name: Migrate v1.0 to Google Drive

on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-v1-google-drive.py'
      - '.github/workflows/migrate-v1-google-drive.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Google Drive migration
        run: python3 scripts/migrate-v1-google-drive.py
      - name: Remove Supabase browser dependency
        run: npm uninstall @supabase/supabase-js
      - name: Verify
        run: |
          npm audit --audit-level=high
          npm test
          npm run build
      - name: Commit product migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src tests docs supabase README.md package.json package-lock.json .env.example
          git commit -m "Use Google Drive appDataFolder for local-first sync"
          git push
