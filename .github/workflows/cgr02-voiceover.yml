name: CGR-02 VoiceOver

on:
  push:
    branches: [main, manager/cgr02-today-vertical-slice-20260923, manager/cgr05-primary-routes-voiceover-20260924]
    paths:
      - 'src/TellPjsdasCapture.tsx'
      - 'e2e/cgr02TodayVoiceOver.voiceover.ts'
      - 'e2e/support/cgr02Journey.ts'
      - 'e2e/cgr02TodayVerticalSlice.e2e.ts'
      - 'e2e/cgr02TodayVerticalSlice.e2e.ts-snapshots/offline-draft-chromium-*.png'
      - 'playwright.voiceover.config.mts'
      - '.github/workflows/cgr02-voiceover.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false @playwright/test@1.63.0
      - run: npx playwright install chromium
      - name: Check settled offline-draft visual baseline
        run: npx playwright test --config=playwright.config.mts --project=chromium -g 'offline capture remains account-scoped'
      - name: Upload visual evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cgr02-offline-draft-macos
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  voiceover:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install bounded screen-reader test dependencies
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0 @guidepup/playwright@0.19.1 @guidepup/guidepup@0.34.0 @guidepup/setup@0.25.3
      - name: Install WebKit
        run: npx playwright install webkit
      - name: Prepare VoiceOver on CI runner
        run: |
          npx @guidepup/setup setup --ci
          npx @guidepup/setup install
      - name: Run real VoiceOver Today and capture journey
        run: npx playwright test --config=playwright.voiceover.config.mts
      - name: Upload failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cgr02-voiceover-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
