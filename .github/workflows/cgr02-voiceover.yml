name: CGR-02 VoiceOver

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/AppV8.tsx'
      - 'src/cloud/instantCommandClient.ts'
      - 'src/cloud/interactionProjection.ts'
      - 'src/tsui02.css'
      - 'src/secondarySurfaces.css'
      - 'src/capture/capture.css'
      - 'src/today/TodayFeature.tsx'
      - 'e2e/cgr02TodayVoiceOver.voiceover.ts'
      - 'playwright.voiceover.config.mts'
      - '.github/workflows/cgr02-voiceover.yml'
  push:
    branches: [main, manager/cgr02-today-vertical-slice-20260923]
    paths:
      - 'src/today/TodayFeature.tsx'
      - 'src/TellPjsdasCapture.tsx'
      - 'src/secondarySurfaces.css'
      - 'e2e/cgr02TodayVoiceOver.voiceover.ts'
      - 'e2e/support/cgr02Journey.ts'
      - 'e2e/cgr02TodayVerticalSlice.e2e.ts'
      - 'e2e/cgr02TodayVerticalSlice.e2e.ts-snapshots/offline-draft-chromium-*.png'
      - 'playwright.voiceover.config.mts'
      - '.github/workflows/cgr02-voiceover.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-macos:
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          node scripts/verify-installed-runtime-lock.mjs --capture
          npm install --no-save @playwright/test@1.63.0
          node scripts/verify-installed-runtime-lock.mjs
      - run: npx playwright install chromium
      - name: Prove mock cloud isolation before application browser tests
        run: npx playwright test --config=playwright.cloud-guard.config.mts --project=chromium
      - name: Check settled offline-draft visual baseline
        run: npx playwright test --config=playwright.config.mts --project=chromium -g 'offline capture queues a stable account command'
      - name: Upload visual evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cgr02-offline-draft-macos
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  voiceover:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install bounded screen-reader test dependencies
        run: |
          node scripts/verify-installed-runtime-lock.mjs --capture
          npm install --no-save @playwright/test@1.63.0 @guidepup/playwright@0.19.1 @guidepup/guidepup@0.34.0 @guidepup/setup@0.25.3
          node scripts/verify-installed-runtime-lock.mjs
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Prove mock cloud isolation before application browser tests
        run: npx playwright test --config=playwright.cloud-guard.config.mts --project=chromium
      - name: Prepare VoiceOver on CI runner
        run: |
          # A fresh macOS runner can transiently miss the Focus UI. Retry
          # preparation once; the real VoiceOver journey remains mandatory.
          npx @guidepup/setup setup --ci || npx @guidepup/setup setup --ci
          npx @guidepup/setup install
      - name: Run real VoiceOver Today and capture journey
        run: npx playwright test --config=playwright.voiceover.config.mts
      - name: Upload failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cgr02-voiceover-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
