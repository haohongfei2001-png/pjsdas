name: Refine UI and language

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refine-ui-i18n.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI and language patch
        run: python3 scripts/refine-ui-i18n.py
      - name: Verify
        run: |
          npm ci
          npm test
          npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppV5.tsx
          git commit -m "Unify app hierarchy and add bilingual navigation"
          git push
