name: Patch v0.8 DB consistency

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v08-db.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch DB update semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/db.ts')
          text = path.read_text()

          old_action = """        await actionStore.put(previous
          ? { ...generated, status: previous.status, updatedAt: previous.updatedAt }
          : generated)
"""
          new_action = """        await actionStore.put(operation.completed
          ? { ...generated, status: 'done', updatedAt: operation.occurredAt }
          : previous
            ? { ...generated, status: previous.status, updatedAt: previous.updatedAt }
            : generated)
"""
          if old_action not in text:
              raise SystemExit('process-event action block not found')
          text = text.replace(old_action, new_action, 1)

          old_merge = """  const mergedActions = mergeActionsForReimport(bundle.actions, previousActions)
  const opportunities = mergeLocallyManagedOpportunities(bundle.opportunities, previousOpportunities)
  const localOpportunityIds = new Set(
    previousOpportunities.filter((item) => item.locallyManaged).map((item) => item.id),
  )
"""
          new_merge = """  const localOpportunityIds = new Set(
    previousOpportunities.filter((item) => item.locallyManaged).map((item) => item.id),
  )
  const mergedActions = mergeActionsForReimport(bundle.actions, previousActions, localOpportunityIds)
  const opportunities = mergeLocallyManagedOpportunities(bundle.opportunities, previousOpportunities)
"""
          if old_merge not in text:
              raise SystemExit('re-import merge block not found')
          text = text.replace(old_merge, new_merge, 1)

          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/db.ts
          git commit -m "Preserve completed history and local action authority"
          git push
