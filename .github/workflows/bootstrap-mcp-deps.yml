name: Bootstrap MCP gateway dependencies

on:
  push:
    paths:
      - '.github/workflows/bootstrap-mcp-deps.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install @modelcontextprotocol/server zod@^4
      - run: npm install --save-dev tsx@^4 @types/node@^22
      - name: Commit dependency manifests
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Dependency manifests already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'Bootstrap MCP gateway dependencies'
          git push
