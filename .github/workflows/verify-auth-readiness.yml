name: Verify authenticated gateway readiness

on:
  push:
    paths:
      - '.github/workflows/verify-auth-readiness.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check production auth readiness
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl -fsS https://pjsdas-remote-alpha.vercel.app/api/health-auth)
          echo "$body"
          echo "$body" | jq -e '.status == "ok" and .checks.tokenEncryptionKey == true and .checks.googleClientId == true and .checks.googleClientSecret == true'
