name: V10 Cloud Foundation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/v10-cloud-foundation.py'
      - 'src/vite-env.d.ts'
      - '.github/workflows/v10-cloud-foundation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize Pages workflow input for one-shot patch
        run: |
          cat > .github/workflows/deploy-pages.yml <<'EOF'
          name: Deploy PJSDAS to GitHub Pages

          on:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read
            pages: write
            id-token: write

          concurrency:
            group: pages
            cancel-in-progress: true

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - run: npm install
                - run: npm run build
                - uses: actions/configure-pages@v5
                  with:
                    enablement: true
                - uses: actions/upload-pages-artifact@v3
                  with:
                    path: ./dist

            deploy:
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              runs-on: ubuntu-latest
              needs: build
              steps:
                - name: Deploy to GitHub Pages
                  id: deployment
                  uses: actions/deploy-pages@v4
          EOF
      - name: Apply v1.0 cloud foundation
        run: python3 scripts/v10-cloud-foundation.py
      - name: Add Supabase browser client
        run: npm install @supabase/supabase-js@^2 --save
      - name: Release v1.0
        run: npm version 1.0.0 --no-git-tag-version --allow-same-version
      - name: Verify
        run: |
          npm audit --audit-level=high
          npm test
          npm run build
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs supabase README.md package.json package-lock.json .env.example .gitignore .github/workflows/deploy-pages.yml
          git commit -m "Add local-first account and cloud sync foundation"
          git push
