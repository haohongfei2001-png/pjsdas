name: V10 Cloud Foundation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/v10-cloud-foundation.py'
      - 'src/vite-env.d.ts'
      - '.github/workflows/v10-cloud-foundation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize Pages workflow input for one-shot patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/deploy-pages.yml')
          s = p.read_text()
          env_block = """  build:\n    runs-on: ubuntu-latest\n    env:\n      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}\n      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}\n    steps:\n"""
          old_block = """  build:\n    runs-on: ubuntu-latest\n    steps:\n"""
          if env_block in s:
              s = s.replace(env_block, old_block, 1)
              p.write_text(s)
          PY
      - name: Apply v1.0 cloud foundation
        run: python3 scripts/v10-cloud-foundation.py
      - name: Add Supabase browser client
        run: npm install @supabase/supabase-js@^2 --save
      - name: Release v1.0
        run: npm version 1.0.0 --no-git-tag-version --allow-same-version
      - name: Verify
        run: |
          npm audit --audit-level=high
          npm test
          npm run build
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs supabase README.md package.json package-lock.json .env.example .gitignore .github/workflows/deploy-pages.yml
          git commit -m "Add local-first account and cloud sync foundation"
          git push
