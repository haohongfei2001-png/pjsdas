name: V09 Rules Round 1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/v09-rules-polish.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Decision Rules consistency polish
        run: python3 scripts/v09-rules-polish.py
      - name: Verify
        run: |
          npm ci
          npm test
          npm run build
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Keep rule-driven labels consistent"
          git push
