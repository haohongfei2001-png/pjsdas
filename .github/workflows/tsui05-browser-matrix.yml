name: TSUI-05 Browser Matrix

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'playwright.config.mts'
      - 'playwright.perf.config.mts'
      - 'playwright.instant.config.mts'
      - 'scripts/tsui01-projection-bench.ts'
      - '.github/workflows/tsui05-browser-matrix.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'playwright.config.mts'
      - 'playwright.instant.config.mts'
      - 'scripts/tsui01-projection-bench.ts'
      - '.github/workflows/tsui05-browser-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firefox-webkit:
    # A draft opt-in must name this exact same-repository head.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, format('full:{0}', github.event.pull_request.head.sha))))
    runs-on: ubuntu-24.04
    # Frozen baseline full Matrix took 23m57s. Sixteen additional cross-engine
    # recovery cases add about two minutes; retain all tests and strict
    # performance thresholds within one bounded 30-minute gate.
    timeout-minutes: 30
    container:
      # Match the runner version below; browsers and OS dependencies are preinstalled.
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0
      - name: Verify browser launch in the test container
        run: |
          # Actions mounts a host-owned home; Firefox requires it to match this container user.
          chown "$(id -u):$(id -g)" "$HOME"
          node --input-type=module -e 'import { firefox, webkit, chromium } from "playwright"; for (const type of [firefox, webkit, chromium]) { const browser = await type.launch({ headless: true }); await browser.close(); }'
      - name: Fixed 300-job, 500-action, 130-node, 2000-history projection sample
        run: npx tsx scripts/tsui01-projection-bench.ts
      - name: Run core routes and schedule anchors in Firefox and WebKit
        run: npx playwright test --config=playwright.config.mts --project=firefox --project=webkit e2e/tsui02Today.e2e.ts e2e/tsui03JobLibrary.e2e.ts e2e/tsui04Schedule.e2e.ts e2e/historyCompletionStartup.e2e.ts e2e/postClosureRecovery.e2e.ts e2e/postClosureHistoryUndo.e2e.ts e2e/denseTodayDecisions.e2e.ts e2e/postClosureAccountRace.e2e.ts e2e/cacheProjectionPersistence.e2e.ts e2e/postZmcDeadlineCorrectness.e2e.ts
      - name: Run dense instant journeys with production React runtime
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/instant
        run: npx playwright test --config=playwright.instant.config.mts --project=firefox --project=webkit
      - name: Measure 300-job warm route and tab paint budget in Chromium
        run: npx playwright test --config=playwright.perf.config.mts --project=chromium --workers=1 e2e/tsui05Performance.perf.ts e2e/instantInteraction.perf.ts
      - name: Upload browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: tsui05-browser-matrix
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
