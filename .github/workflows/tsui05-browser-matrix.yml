name: TSUI-05 Browser Matrix

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'playwright.config.mts'
      - 'playwright.perf.config.mts'
      - 'playwright.instant.config.mts'
      - 'scripts/tsui01-projection-bench.ts'
      - '.github/workflows/tsui05-browser-matrix.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'playwright.config.mts'
      - 'playwright.instant.config.mts'
      - 'scripts/tsui01-projection-bench.ts'
      - '.github/workflows/tsui05-browser-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firefox-webkit:
    # A draft opt-in must name this exact same-repository head.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, format('full:{0}', github.event.pull_request.head.sha))))
    runs-on: ubuntu-24.04
    # PR216 added 18 cross-engine review journeys. All 204 core + 134 dense
    # cases passed, but the 30-minute orchestration cap cut off the final
    # performance tail. Allow bounded runner overhead; retain every test and
    # every strict per-interaction performance threshold unchanged.
    timeout-minutes: 35
    container:
      # Match the runner version below; browsers and OS dependencies are preinstalled.
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright test runner
        run: |
          node scripts/verify-installed-runtime-lock.mjs --capture
          npm install --no-save @playwright/test@1.63.0
          node scripts/verify-installed-runtime-lock.mjs
      - name: Verify browser launch in the test container
        run: |
          # Actions mounts a host-owned home; Firefox requires it to match this container user.
          chown "$(id -u):$(id -g)" "$HOME"
          # Resolve inside this container; github.workspace is a host path here.
          # Inherit one policy variable, never serialize launchOptions.env.
          export PLAYWRIGHT_FIREFOX_POLICIES_JSON="$PWD/e2e/support/firefoxMockPolicies.json"
          test -r "$PLAYWRIGHT_FIREFOX_POLICIES_JSON"
          printf '%s\n' "PLAYWRIGHT_FIREFOX_POLICIES_JSON=$PLAYWRIGHT_FIREFOX_POLICIES_JSON" >> "$GITHUB_ENV"
          node --input-type=module <<'NODE'
          import { firefox, webkit, chromium } from 'playwright'
          import { readFile } from 'node:fs/promises'
          import assert from 'node:assert/strict'
          const policy = JSON.parse(await readFile(process.env.PLAYWRIGHT_FIREFOX_POLICIES_JSON, 'utf8'))
          assert.deepEqual(policy, { policies: { DisableAppUpdate: true } })
          console.log('Firefox temporary policy file is readable and exact; activation is not asserted by this smoke check.')
          for (const type of [firefox, webkit, chromium]) {
            const browser = await type.launch({ headless: true })
            await browser.close()
          }
          NODE
      - name: Prove mock cloud isolation before application browser tests
        run: npx playwright test --config=playwright.cloud-guard.config.mts --project=chromium --project=firefox --project=webkit
      - name: Fixed 300-job, 500-action, 130-node, 2000-history projection sample
        run: npx tsx scripts/tsui01-projection-bench.ts
      - name: Run core routes, schedule anchors and consumer consent in Firefox and WebKit
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/core
        run: npx playwright test --config=playwright.config.mts --project=firefox --project=webkit --output=test-results/core e2e/tsui02Today.e2e.ts e2e/todayCapacityInline.e2e.ts e2e/tsui03JobLibrary.e2e.ts e2e/tsui04Schedule.e2e.ts e2e/historyCompletionStartup.e2e.ts e2e/postClosureRecovery.e2e.ts e2e/postClosureHistoryUndo.e2e.ts e2e/denseTodayDecisions.e2e.ts e2e/postClosureAccountRace.e2e.ts e2e/cacheProjectionPersistence.e2e.ts e2e/postZmcDeadlineCorrectness.e2e.ts e2e/recordEvidenceCorrection.e2e.ts e2e/recordCorrectionReview.e2e.ts e2e/scopedManagementConsent.e2e.ts e2e/reviewerSignIn.e2e.ts
      - name: Run dense instant journeys with production React runtime
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/instant
        run: npx playwright test --config=playwright.instant.config.mts --project=firefox --project=webkit
      - name: Measure 300-job warm route and tab paint budget in Chromium
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/performance
        run: npx playwright test --config=playwright.perf.config.mts --project=chromium --workers=1 --output=test-results/performance e2e/tsui05Performance.perf.ts e2e/instantInteraction.perf.ts
      - name: Upload browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: tsui05-browser-matrix
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
