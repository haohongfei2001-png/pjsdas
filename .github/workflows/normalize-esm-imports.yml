name: Normalize ESM import specifiers

on:
  push:
    paths:
      - '.github/workflows/normalize-esm-imports.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add explicit .js specifiers for relative TypeScript modules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          patterns = [
              re.compile(r"(?P<prefix>\bfrom\s*)(?P<q>['\"])(?P<spec>\.{1,2}/[^'\"]+)(?P=q)"),
              re.compile(r"(?P<prefix>\bimport\s*)(?P<q>['\"])(?P<spec>\.{1,2}/[^'\"]+)(?P=q)"),
              re.compile(r"(?P<prefix>\bimport\s*\(\s*)(?P<q>['\"])(?P<spec>\.{1,2}/[^'\"]+)(?P=q)"),
          ]

          def normalized_spec(source: Path, spec: str) -> str:
              # Never rewrite imports that already name a runtime/resource extension.
              suffix = Path(spec).suffix
              if suffix in {'.js', '.mjs', '.cjs', '.json', '.css', '.scss', '.sass', '.less', '.svg', '.png', '.jpg', '.jpeg', '.webp', '.wasm'}:
                  return spec
              base = (source.parent / spec)
              if suffix in {'.ts', '.tsx'}:
                  return spec[: -len(suffix)] + '.js'
              if base.with_suffix('.ts').exists() or base.with_suffix('.tsx').exists():
                  return spec + '.js'
              if base.is_dir() and ((base / 'index.ts').exists() or (base / 'index.tsx').exists()):
                  return spec.rstrip('/') + '/index.js'
              return spec

          changed = []
          for path in sorted(root.rglob('*')):
              if path.suffix not in {'.ts', '.tsx'}:
                  continue
              if any(part in {'node_modules', 'dist', '.git'} for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              for pattern in patterns:
                  def repl(match):
                      spec = match.group('spec')
                      new_spec = normalized_spec(path, spec)
                      return f"{match.group('prefix')}{match.group('q')}{new_spec}{match.group('q')}"
                  text = pattern.sub(repl, text)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f'Normalized {len(changed)} files:')
          for item in changed:
              print(item)
          PY

          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.ts' '*.tsx'
          git commit -m 'Normalize relative ESM imports for Vercel runtime'
          git push origin HEAD:main
