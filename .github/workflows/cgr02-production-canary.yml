name: CGR-02 Production Command Canary

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact integrated runtime SHA deployed to the canonical production API
        required: true
        type: string
      recovery_user_id:
        description: Optional exact synthetic user UUID to remove only when revoked and free of commands
        required: false
        type: string

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: production-certification
    env:
      PJSDAS_CGR02_CANARY_ORIGIN: ${{ vars.PJSDAS_CANONICAL_API_ORIGIN || 'https://pjsdas-remote-alpha.vercel.app' }}
      PJSDAS_EXPECTED_COMMIT_SHA: ${{ inputs.expected_sha }}
      PJSDAS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PJSDAS_SUPABASE_SERVICE_ROLE_KEY }}
      PJSDAS_CGR02_RECOVERY_USER_ID: ${{ inputs.recovery_user_id }}
    steps:
      - name: Check exact integrated input and server credential
        shell: bash
        run: |
          if [[ ! "$PJSDAS_EXPECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Expected exact integrated SHA is invalid.' >&2
            exit 1
          fi
          if [[ -z "$PJSDAS_SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo 'Synthetic test identity server credential is not configured.' >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Recover verified unused account or run exact-production canary
        shell: bash
        run: |
          if [[ -n "$PJSDAS_CGR02_RECOVERY_USER_ID" ]]; then
            ./node_modules/.bin/tsx scripts/cgr02-provisioned-production-canary.ts --execute "--recover-user-id=$PJSDAS_CGR02_RECOVERY_USER_ID"
          else
            ./node_modules/.bin/tsx scripts/cgr02-provisioned-production-canary.ts --execute
          fi
