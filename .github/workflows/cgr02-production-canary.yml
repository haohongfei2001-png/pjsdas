name: CGR-02 Production Command Canary

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact integrated runtime SHA deployed to the canonical production API
        required: true
        type: string

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: production-certification
    env:
      PJSDAS_CGR02_CANARY_ORIGIN: ${{ vars.PJSDAS_CANONICAL_API_ORIGIN || 'https://pjsdas-remote-alpha.vercel.app' }}
      PJSDAS_EXPECTED_COMMIT_SHA: ${{ inputs.expected_sha }}
      PJSDAS_CGR02_CANARY_ACCESS_TOKEN_A: ${{ secrets.PJSDAS_CGR02_CANARY_ACCESS_TOKEN_A }}
      PJSDAS_CGR02_CANARY_ACCESS_TOKEN_B: ${{ secrets.PJSDAS_CGR02_CANARY_ACCESS_TOKEN_B }}
    steps:
      - name: Check exact integrated input and approved test sessions
        shell: bash
        run: |
          if [[ ! "$PJSDAS_EXPECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Expected exact integrated SHA is invalid.' >&2
            exit 1
          fi
          if [[ -z "$PJSDAS_CGR02_CANARY_ACCESS_TOKEN_A" || -z "$PJSDAS_CGR02_CANARY_ACCESS_TOKEN_B" ]]; then
            echo 'Approved CGR-02 two-session test credentials are not configured.' >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bounded synthetic production command journey and verified cleanup
        run: ./node_modules/.bin/tsx scripts/cgr02-production-canary.ts --execute
