            "  const company = normalizeInferredCompany(text.slice(0, best.index).trim().replace(/[：:｜|]+$/, ''))\n  const role = text.slice(best.index).trim()\n  if (company.length < 2 || role.length < 2) return undefined\n  return { company, roleText: role }\n",
            1,
          )
