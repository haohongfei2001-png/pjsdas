name: Patch progress v2 targeting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-progress-v2-targeting.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch parser targeting and historical closure semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/progressUpdateV2.ts')
          s = p.read_text()

          old = '''function brandAliases(company: string) {
  const key = compact(company)
  return BRAND_ALIAS_GROUPS.find((group) =>
    group.some((alias) => {
      const aliasKey = compact(alias)
      return key === aliasKey || key.includes(aliasKey) || aliasKey.includes(key)
    }),
  ) ?? []
}
'''
          new = '''function brandAliases(company: string) {
  const key = compact(company)
  return BRAND_ALIAS_GROUPS.find((group) =>
    group.some((alias) => {
      const aliasKey = compact(alias)
      if (key === aliasKey) return true
      // Short Chinese aliases such as “京东” must not match a longer unrelated
      // company such as “京东方”. Only longer aliases may match inside a
      // decorated canonical company label.
      return aliasKey.length >= 4 && (key.includes(aliasKey) || aliasKey.includes(key))
    }),
  ) ?? []
}
'''
          if old not in s: raise SystemExit('brandAliases block not found')
          s = s.replace(old, new, 1)

          old = '''function companyAliases(company: string) {
  const aliases = new Set<string>([company.trim(), ...brandAliases(company)])
  let short = company.trim()
'''
          new = '''function companyAliases(company: string) {
  const aliases = new Set<string>([company.trim(), ...brandAliases(company)])
  const visibleName = company.split(/[（(]/)[0]?.trim()
  if (visibleName && compact(visibleName).length >= 2) aliases.add(visibleName)
  let short = company.trim()
'''
          if old not in s: raise SystemExit('companyAliases start not found')
          s = s.replace(old, new, 1)

          old = '''function removeMatchedCompanyPrefix(text: string, match: CompanyMatch) {
  const aliases = [match.alias, ...companyAliases(match.company)]
    .sort((a, b) => b.length - a.length)
  let result = text.trim()
  for (const alias of aliases) {
    const index = compact(result).startsWith(compact(alias)) ? result.toLowerCase().indexOf(alias.toLowerCase()) : -1
    if (index === 0) {
      result = result.slice(alias.length).trim()
      break
    }
  }
  return result.replace(/^(?:集团|科技|汽车)\\s*/i, '').trim()
}
'''
          new = '''function removeMatchedCompanyPrefix(text: string, match: CompanyMatch) {
  const aliases = [match.alias, ...companyAliases(match.company)]
    .sort((a, b) => b.length - a.length)
  let result = text.trim().replace(/^[：:｜|]+/, '').trim()
  let changed = true
  while (changed) {
    changed = false
    for (const alias of aliases) {
      if (result.toLowerCase().startsWith(alias.toLowerCase())) {
        result = result.slice(alias.length).replace(/^[：:｜|]+/, '').trim()
        changed = true
        break
      }
    }
  }
  return result.replace(/^(?:集团|科技|汽车)\\s*/i, '').trim()
}

function normalizeInferredCompany(company: string) {
  return company
    .replace(/[（(][^）)]*(?:\\d{2}届|ASP|校招|校园|提前批)[^）)]*[）)]\\s*$/i, '')
    .trim()
}
'''
