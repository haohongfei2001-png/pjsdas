        const inferred = inferCompanyAndRole(closePayload, virtual)
        if (inferred) {
          const inferredRoles = roleList(inferred.roleText)
          const inferredRole = inferredRoles.length === 1 ? inferredRoles[0] : undefined
          if (inferredRole) {
            const existing = existingForCompanyRole(virtual, inferred.company, inferredRole)
            const opportunity = existing ?? virtualOpportunity(
              localOpportunityId(inferred.company, inferredRole),
