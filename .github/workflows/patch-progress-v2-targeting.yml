'''
          new = '''    const closeLike = /(流程(?:结束|终止)|终止流程|结束流程|流程关闭)/.test(sourceText)
    if (closeLike) {
      let target = targetFor(sourceText, virtual, recentByCompany, 'rejection')
      if (!target.opportunity) {
        const closePayload = sourceText
          .replace(/(?:流程(?:结束|终止)|终止流程|结束流程|流程关闭)/g, '')
