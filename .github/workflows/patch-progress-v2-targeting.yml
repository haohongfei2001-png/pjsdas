          old = '''function touchRecent(recentByCompany: Map<string, string>, company: string, opportunityId: string) {
  const key = compact(companyAliases(company)[0] ?? company)
  const previous = recentByCompany.get(key)
  if (previous === undefined || previous === opportunityId) recentByCompany.set(key, opportunityId)
  else recentByCompany.set(key, '')
}
'''
          new = '''function touchRecent(recentByCompany: Map<string, string>, company: string, opportunityId: string) {
  const key = compact(companyAliases(company)[0] ?? company)
  // Timeline input is chronological. A later clause for the same company should
  // replace an earlier touched role rather than permanently making the company
  // ambiguous.
  recentByCompany.set(key, opportunityId)
}

function clearRecent(recentByCompany: Map<string, string>, company: string) {
  const key = compact(companyAliases(company)[0] ?? company)
  recentByCompany.set(key, '')
}
'''
          if old not in s: raise SystemExit('touchRecent block not found')
          s = s.replace(old, new, 1)

