  it('does not confuse a short brand with a longer company sharing the same prefix', () => {
    const roles = [opportunity('BOE-PM', '京东方 BOE', '产品经理', 'not_applied')]
    const plan = parseProgressUpdate('9月10日，投递京东技术产品经理。', roles, now)
    const submitted = plan.operations.find((item) => item.kind === 'upsert_opportunity')
    expect(submitted).toMatchObject({
      kind: 'upsert_opportunity',
      company: '京东',
      role: '技术产品经理',
      mode: 'submitted',
    })
  })

  it('lets a later explicit role replace an older touched role for company-only follow-up', () => {
    const roles = [
      opportunity('D-OPS', '丁公司', '研发运营'),
      opportunity('D-STRATEGY', '丁公司', '战略分析', 'not_applied'),
    ]
    const plan = parseProgressUpdate(
      '9月4日，丁公司研发运营AI面试。\n9月9日，投丁公司战略分析。\n9月11日，丁公司在线测评。',
      roles,
      now,
    )
    const assessment = plan.operations.find(
      (item) => item.kind === 'process_event' && item.eventType === 'assessment_invite',
    )
    expect(assessment).toMatchObject({ kind: 'process_event', opportunityId: 'D-STRATEGY' })
  })

  it('removes clock text from a role hint before matching a fixed interview', () => {
    const roles = [
      opportunity('E-RD', '戊公司', '产学研合作工程师-园区'),
      opportunity('E-PLAN', '戊公司', '生产计划工程师'),
    ]
    const plan = parseProgressUpdate('9月22日，戊公司产学研合作工程师10点面试。', roles, now)
    const interview = plan.operations.find(
      (item) => item.kind === 'process_event' && item.eventType === 'interview_invite',
    )
    expect(interview).toMatchObject({ kind: 'process_event', opportunityId: 'E-RD' })
  })

  it('creates a closed local opportunity when an old flow names a new company and role', () => {
    const plan = parseProgressUpdate('9月6日，NOVA（27届 ASP）AI产品经理培训生流程终止。', current, now)
    const closed = plan.operations.find((item) => item.kind === 'close_opportunity')
    expect(closed).toMatchObject({
      kind: 'close_opportunity',
      company: 'NOVA',
      role: 'AI产品经理培训生',
    })
    expect(plan.unresolved).toHaveLength(0)
  })

  it('does not force a company-only old closed flow into manual repair', () => {
    const plan = parseProgressUpdate('9月4日，ZS流程结束。', current, now)
    expect(plan.unresolved).toHaveLength(0)
    expect(plan.ignored).toHaveLength(1)
  })

  it('turns a dated standalone administrative task into a manual action', () => {
    const plan = parseProgressUpdate('9月11日，2027届毕业生源信息校对。', current, now)
    expect(plan.operations[0]).toMatchObject({
