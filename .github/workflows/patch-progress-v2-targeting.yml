        for (const role of inferredRoles) {
          if (!role || role.length < 2) continue
'''
          if old not in s: raise SystemExit('application role loop start not found')
          s = s.replace(old, new, 1)

          old = '''          touchRecent(recentByCompany, inferred.company, opportunityId)
        }
