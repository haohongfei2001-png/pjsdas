    const relativeDue = relativeDueAt(sourceText, occurredAt)
'''
          new = '''          touchRecent(recentByCompany, inferred.company, opportunityId)
        }
        if (inferredRoles.length > 1) clearRecent(recentByCompany, inferred.company)
      }
    }

    const relativeDue = relativeDueAt(sourceText, occurredAt)
'''
