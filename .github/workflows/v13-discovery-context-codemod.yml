name: v1.3 discovery context codemod

on:
  push:
    branches: [v1.3-discovery-alpha]
    paths:
      - '.github/workflows/v13-discovery-context-codemod.yml'

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.3-discovery-alpha
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/v13-discovery-context-codemod.mjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/AppV5.tsx src/ai/readLayer.ts gateway/readTools.ts gateway/serverFactory.ts tests/mcpGateway.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Add Discovery Profile UI and MCP discovery context'
          git push origin HEAD:v1.3-discovery-alpha
