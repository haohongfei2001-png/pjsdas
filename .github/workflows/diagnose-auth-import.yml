name: Diagnose authenticated module imports

on:
  push:
    paths:
      - '.github/workflows/diagnose-auth-import.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Compare local import forms
        shell: bash
        run: |
          set -euo pipefail
          base='https://pjsdas-remote-alpha.vercel.app'
          for i in {1..24}; do
            js_code=$(curl -sS -o /tmp/js.json -w '%{http_code}' "$base/api/diagnose-local-js" || true)
            ext_code=$(curl -sS -o /tmp/ext.json -w '%{http_code}' "$base/api/diagnose-local-extensionless" || true)
            if [ "$js_code" != '404' ] && [ "$ext_code" != '404' ]; then break; fi
            sleep 5
          done
          echo "explicit_js_status=$js_code"
          cat /tmp/js.json
          echo
          echo "extensionless_status=$ext_code"
          cat /tmp/ext.json
          echo
          test "$js_code" = '200'
