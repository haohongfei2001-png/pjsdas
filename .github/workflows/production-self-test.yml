name: PJSDAS Production Self-Test

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy PJSDAS to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  self-test:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PJSDAS_EXPECTED_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      PJSDAS_EXPECTED_WORKSPACE_AUTHORITY: ${{ vars.PJSDAS_CONNECTED_AUTHORITY || 'google-drive' }}
      PJSDAS_EXPECTED_AUDIENCE_MODE: ${{ vars.PJSDAS_AUDIENCE_MODE || 'legacy' }}
      PJSDAS_EXPECTED_CANONICAL_WEB_ORIGIN: ${{ vars.PJSDAS_CANONICAL_WEB_ORIGIN }}
      PJSDAS_EXPECTED_CANONICAL_API_ORIGIN: ${{ vars.PJSDAS_CANONICAL_API_ORIGIN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production read-only self-test
        env:
          PJSDAS_PRODUCTION_BASE_URLS: ${{ vars.PJSDAS_BACKEND_ORIGINS || 'https://pjsdas-remote-alpha.vercel.app' }}
          PJSDAS_PRODUCTION_WEB_URL: ${{ vars.PJSDAS_CANONICAL_WEB_ORIGIN || 'https://haohongfei2001-png.github.io/pjsdas' }}
        run: npm run self-test:production
