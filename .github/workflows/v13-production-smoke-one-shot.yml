name: v1.3 production smoke one-shot

on:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify v1.3 production public contract
        env:
          PJSDAS_BASE_URL: https://pjsdas-remote-alpha.vercel.app
          PJSDAS_EXPECTED_VERSION: 1.3.0-alpha.1
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            echo "Production smoke attempt ${attempt}/30"
            if node scripts/v13-production-smoke.mjs; then
              exit 0
            fi
            sleep 10
          done
          echo "Production never satisfied the v1.3 public contract." >&2
          exit 1
