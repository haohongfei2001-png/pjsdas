name: Publish verified PJSDAS release

on:
  workflow_run:
    workflows: ["PJSDAS Production Self-Test"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Load release plan
        id: plan
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs')
          const plan = JSON.parse(fs.readFileSync('.github/release-plan.json', 'utf8'))
          for (const key of ['publicVersion', 'tag', 'releaseNotes', 'releaseChannel']) {
            if (typeof plan[key] !== 'string' || !plan[key].trim()) {
              throw new Error(`release plan is missing ${key}`)
            }
          }
          console.log(`publish=${plan.publishOnProductionSuccess === true ? 'true' : 'false'}`)
          console.log(`version=${plan.publicVersion}`)
          console.log(`tag=${plan.tag}`)
          if (!['prerelease', 'stable'].includes(plan.releaseChannel)) {
            throw new Error('releaseChannel must be prerelease or stable')
          }
          console.log(`notes=${plan.releaseNotes}`)
          console.log(`channel=${plan.releaseChannel}`)
          NODE

      - name: Verify release version contract
        if: ${{ steps.plan.outputs.publish == 'true' }}
        env:
          PUBLIC_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_NOTES: ${{ steps.plan.outputs.notes }}
          RELEASE_CHANNEL: ${{ steps.plan.outputs.channel }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const version = process.env.PUBLIC_VERSION
          const tag = process.env.RELEASE_TAG
          const notes = process.env.RELEASE_NOTES
          const channel = process.env.RELEASE_CHANNEL
          if (pkg.version !== version) throw new Error(`package version ${pkg.version} does not match release ${version}`)
          if (tag !== `v${version}`) throw new Error(`release tag ${tag} must equal v${version}`)
          if (!fs.existsSync(notes)) throw new Error(`release notes not found: ${notes}`)
          const isPrereleaseVersion = version.includes('-')
          if (channel === 'prerelease' && !isPrereleaseVersion) throw new Error('prerelease channel requires a SemVer prerelease version')
          if (channel === 'stable' && isPrereleaseVersion) throw new Error('stable channel cannot publish a SemVer prerelease version')
          NODE

      - name: Verify immutable releases are enabled
        if: ${{ steps.plan.outputs.publish == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          status="$(curl -sS -o "$tmp" -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/immutable-releases")"
          if [ "$status" != "200" ]; then
            echo "GitHub immutable releases are not enabled or cannot be verified (HTTP $status); refusing publication." >&2
            cat "$tmp" >&2 || true
            exit 1
          fi
          node -e '
            const fs = require("node:fs")
            const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8"))
            if (payload.enabled !== true) throw new Error("immutable releases are not enabled")
          ' "$tmp"
          rm -f "$tmp"

      - name: Create version-pinned GitHub Release
        if: ${{ steps.plan.outputs.publish == 'true' }}
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_NOTES: ${{ steps.plan.outputs.notes }}
          RELEASE_CHANNEL: ${{ steps.plan.outputs.channel }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; publication is idempotently complete."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists without a GitHub Release; refusing to move or reuse it." >&2
            exit 1
          fi

          extra_args=()
          if [ "$RELEASE_CHANNEL" = "prerelease" ]; then
            extra_args+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "PJSDAS ${RELEASE_TAG}" \
            --notes-file "$RELEASE_NOTES" \
            "${extra_args[@]}"

          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          RELEASE_CHANNEL="$RELEASE_CHANNEL" node -e '
            const release = JSON.parse(process.argv[1])
            const channel = process.env.RELEASE_CHANNEL
            if (release.immutable !== true) throw new Error("published release is not immutable")
            if ((channel === "prerelease") !== (release.prerelease === true)) {
              throw new Error("published release channel does not match release plan")
            }
          ' "$release_json"

          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
