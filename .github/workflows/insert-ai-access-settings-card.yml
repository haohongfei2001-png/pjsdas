name: Insert AI access settings card

on:
  push:
    paths:
      - '.github/workflows/insert-ai-access-settings-card.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CloudSettingsCard
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/cloud/CloudSettingsCard.tsx')
          text = path.read_text()
          old_import = "import { useCloud } from './CloudContext'\n"
          new_import = old_import + "import AiAccessSettingsCard from '../aiAccess/AiAccessSettingsCard'\n"
          if "AiAccessSettingsCard" not in text:
              text = text.replace(old_import, new_import, 1)
          start = '  return (\n    <section className="cloud-settings-card">'
          if start in text:
              text = text.replace(start, '  return (\n    <>\n      <section className="cloud-settings-card">', 1)
          end = '      <small className="cloud-security-note">{zh ? \'Google Access Token 只保存在当前页面内存中，不写入 IndexedDB 或 localStorage；授权过期只会暂停云同步，本地 PJSDAS 继续可用。\' : \'The Google access token is kept only in current-page memory, never IndexedDB or localStorage. Expired authorization pauses cloud sync while local PJSDAS remains usable.\'}</small>\n    </section>\n  )'
          replacement = '      <small className="cloud-security-note">{zh ? \'Google Access Token 只保存在当前页面内存中，不写入 IndexedDB 或 localStorage；授权过期只会暂停云同步，本地 PJSDAS 继续可用。\' : \'The Google access token is kept only in current-page memory, never IndexedDB or localStorage. Expired authorization pauses cloud sync while local PJSDAS remains usable.\'}</small>\n      </section>\n      <AiAccessSettingsCard />\n    </>\n  )'
          if '<AiAccessSettingsCard />' not in text:
              if end not in text:
                  raise SystemExit('Expected CloudSettingsCard tail not found')
              text = text.replace(end, replacement, 1)
          path.write_text(text)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cloud/CloudSettingsCard.tsx
          git diff --cached --quiet || git commit -m "Show AI access setup in Settings"
          git push
