name: Round 3 discovery feedback one-shot

on:
  push:
    branches: [round3-final]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: round3-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Round 3 codemod
        run: python3 scripts/round3_codemod.py
      - run: npm ci
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - name: Commit implementation
        run: |
          set -euo pipefail
          git config user.name "haohongfei2001-png"
          git config user.email "haohongfei2001@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "v1.3 Round 3: discovery review and feedback loop"
          git push origin HEAD:round3-final
